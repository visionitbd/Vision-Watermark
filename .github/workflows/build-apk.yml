name: Build V-Watermark APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate signing keystore for installable Release APK
        run: |
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias visionwatermark \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass vision1234 -keypass vision1234 \
            -dname "CN=Vision IT, OU=Mobile, O=Vision IT, L=Saidpur, S=Rangpur, C=BD"

      - name: Build Release APK (arm64-v8a compact)
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/V-Watermark-v1.0.apk
          ls -lh release-output/V-Watermark-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-Watermark-APK
          path: release-output/V-Watermark-v1.0.apk
          retention-days: 30
